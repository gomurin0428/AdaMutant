# The tests run first, and the mutants that they do not detect go to the
# proof.  The test only calls Increment, so the mutants of Saturating_Add
# and of Halves are detected only when GNATprove can no longer prove the
# contracts.  With --counterexamples=on GNATprove checks its
# counterexamples with the real code: the console then tells the confirmed
# failures from those that come from a contract that says too little (the
# postcondition of Halves.Half).
mutate = ["src/**/*.adb"]
build = "gprbuild -p -q -P counters_tests.gpr"
test = '"bin/test_counters"'
prove = "gnatprove -P counters.gpr --level=1 --report=fail --checks-as-errors=on --counterexamples=on -j1"
concurrency = 2
sandbox_exclude = [".git", "obj", "bin"]
